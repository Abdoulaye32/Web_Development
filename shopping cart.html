<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Calculator</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#111827;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.12);
      --text:#e5e7eb;
      --muted:rgba(229,231,235,.7);
      --accent:#22c55e;
      --danger:#ef4444;
      --btn:#1f2937;
      --btn2:#374151;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 480px at 10% 0%, #1f2a44 0%, transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .wrap{
      width: min(720px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius:16px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    header{
      padding:18px 18px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    header h1{
      margin:0;
      font-size:18px;
      letter-spacing:.2px;
    }
    header p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.3;
    }

    main{ padding:16px; }

    .row{
      display:grid;
      grid-template-columns: 1.4fr 1fr 1fr 0.8fr;
      gap:10px;
      align-items:end;
      margin-bottom:12px;
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    input{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color:var(--text);
      padding:12px 12px;
      outline:none;
      font-size:14px;
    }
    input:focus{
      border-color: rgba(34,197,94,.65);
      box-shadow: 0 0 0 3px rgba(34,197,94,.18);
    }

    .btnbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:8px 0 14px;
    }

    button{
      border:1px solid rgba(255,255,255,.14);
      background: var(--btn);
      color:var(--text);
      border-radius:12px;
      padding:11px 14px;
      font-weight:700;
      cursor:pointer;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
    }
    button:active{ transform: scale(.98); }

    .btn-primary{
      background: rgba(34,197,94,.18);
      border-color: rgba(34,197,94,.45);
      color:#bbf7d0;
    }

    .btn-ghost{
      background: transparent;
      border-color: rgba(255,255,255,.14);
      color: var(--text);
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.12);
    }

    thead th{
      text-align:left;
      font-size:12px;
      color: var(--muted);
      padding:12px 12px;
      border-bottom:1px solid rgba(255,255,255,.10);
      font-weight:800;
    }

    tbody td{
      padding:12px 12px;
      border-bottom:1px solid rgba(255,255,255,.06);
      vertical-align:middle;
      font-size:14px;
    }

    tbody tr:last-child td{ border-bottom:none; }

    .money{
      text-align:right;
      font-variant-numeric: tabular-nums;
    }

    .actions{
      text-align:right;
    }

    .small-btn{
      padding:8px 10px;
      border-radius:10px;
      background: rgba(239,68,68,.16);
      border-color: rgba(239,68,68,.35);
      color:#fecaca;
      font-weight:800;
    }

    .summary{
      margin-top:14px;
      display:flex;
      justify-content:flex-end;
    }

   .summary-card{
      width: 60%;
      min-width: 280px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding:14px 14px;
    }

    .sum-line{
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:13px;
      margin-bottom:8px;
    }

    .total{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:12px;
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .total .label{
      color: var(--muted);
      font-weight:800;
      letter-spacing:.2px;
    }

    .total .value{
      font-size:26px;
      font-weight:900;
      color:#eafff2;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 640px){
      .row{
        grid-template-columns: 1fr 1fr;
      }
      .summary-card{ width:100%; }
      .actions{ text-align:left; }
      .money{ text-align:left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Shopping Price Calculator</h1>
      <p>Enter an item’s name, unit price, and quantity. The app calculates each line total and the overall total.</p>
    </header>

    <main>
      <div class="row" style="margin-bottom:10px;">
        <div>
          <label for="name">Item</label>
          <input id="name" type="text" placeholder="e.g., Milk" />
        </div>
        <div>
          <label for="price">Unit Price</label>
          <input id="price" type="number" min="0" step="0.01" placeholder="e.g., 2.50" />
        </div>
        <div>
          <label for="qty">Quantity</label>
          <input id="qty" type="number" min="0" step="1" placeholder="e.g., 3" />
        </div>
        <div style="padding-bottom:22px;">
          <button class="btn-primary" id="addBtn" type="button" style="width:100%;">Add Item</button>
        </div>
      </div>

      <div class="btnbar">
        <button class="btn-ghost" id="clearBtn" type="button">Clear All</button>
      </div>

      <table aria-label="Shopping cart items">
        <thead>
          <tr>
            <th>Item</th>
            <th class="money">Unit Price</th>
            <th class="money">Quantity</th>
            <th class="money">Line Total</th>
            <th class="actions">Remove</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- rows inserted here -->
        </tbody>
      </table>

      <div class="summary">
        <div class="summary-card">
          <div class="sum-line">
            <span>Total Items</span>
            <span id="count">0</span>
          </div>
          <div class="total">
            <span class="label">Total Shopping Price</span>
            <span class="value" id="grandTotal">$0.00</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const nameEl = document.getElementById("name");
    const priceEl = document.getElementById("price");
    const qtyEl = document.getElementById("qty");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const tbody = document.getElementById("tbody");

    const countEl = document.getElementById("count");
    const grandTotalEl = document.getElementById("grandTotal");

    let items = []; // {id, name, price, qty}

    function formatMoney(n){
      const num = Number(n);
      if (Number.isNaN(num)) return "$0.00";
      return num.toLocaleString(undefined, { style:"currency", currency:"USD" });
    }

    function computeLineTotal(item){
      return Number(item.price) * Number(item.qty);
    }

    function render(){
      tbody.innerHTML = "";

      items.forEach(item => {
        const tr = document.createElement("tr");
        const lineTotal = computeLineTotal(item);

  tr.innerHTML = 
          <td>${escapeHtml(item.name)}</td>
          <td class="money">${formatMoney(item.price)}</td>
          <td class="money">${item.qty}</td>
          <td class="money">${formatMoney(lineTotal)}</td>
          <td class="actions">
            <button class="small-btn" type="button" data-id="${item.id}">✕</button>
          </td>
        ;
        tbody.appendChild(tr);
      });

      // totals
      const totalItems = items.reduce((acc) => acc + 1, 0);
      const grandTotal = items.reduce((acc, item) => acc + computeLineTotal(item), 0);

      countEl.textContent = totalItems;
      grandTotalEl.textContent = formatMoney(grandTotal);
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function addItem(){
      const name = nameEl.value.trim();
      const price = Number(priceEl.value);
      const qty = Number(qtyEl.value);

      if (!name){
        alert("Please enter an item name.");
        return;
      }
      if (!Number.isFinite(price) || price < 0){
        alert("Please enter a valid unit price (0 or greater).");
        return;
      }
      if (!Number.isFinite(qty) || qty < 0){
        alert("Please enter a valid quantity (0 or greater).");
        return;
      }

      const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());

      items.push({ id, name, price, qty });

      // reset fields
      nameEl.value = "";
      priceEl.value = "";
      qtyEl.value = "";

      render();
    }

    function removeItem(id){
      items = items.filter(x => x.id !== id);
      render();
    }

    addBtn.addEventListener("click", addItem);

    clearBtn.addEventListener("click", () => {
      items = [];
      render();
      nameEl.focus();
    });

    tbody.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      removeItem(btn.dataset.id);
    });

    // Optional: press Enter to add
    [nameEl, priceEl, qtyEl].forEach(el => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addItem();
      });
    });

    render();
  </script>
</body>
</html>
